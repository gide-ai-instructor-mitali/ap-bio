<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cladogram</title>
    <style>
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --primary: #3b82f6;
            --selected: #fde047;
            --correct: #22c55e;
            --incorrect: #ef4444;
        }

        body { font-family: system-ui, sans-serif; background: var(--bg); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 900px; background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; background: #fff; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: center; }
        .total-cell { background: #f8fafc; font-weight: bold; color: var(--primary); }

        .quiz-layout { display: grid; grid-template-columns: 200px 1fr; gap: 20px; margin-top: 20px; }
        
        .bank { background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .item { 
            padding: 10px; background: white; border: 2px solid #cbd5e1; 
            border-radius: 6px; margin-bottom: 8px; cursor: pointer; 
            font-weight: bold; text-align: center; transition: 0.2s;
        }
        .item:hover { border-color: var(--primary); }
        .item.selected { background: var(--selected); border-color: orange; transform: scale(1.05); }

        .cladogram-panel { 
            position: relative; height: 450px; border: 1px solid #e2e8f0; 
            border-radius: 8px; background: white; 
        }

        .slot {
            position: absolute; width: 110px; height: 40px;
            border: 2px dashed #cbd5e1; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: #94a3b8; cursor: pointer; background: white;
            z-index: 10; overflow: hidden;
        }
        .slot:hover { border-color: var(--primary); background: #eff6ff; }
        .slot.filled { border-style: solid; color: black; font-size: 13px; border-color: #94a3b8; }
        .slot.correct { background: #dcfce7; border-color: var(--correct); }
        .slot.incorrect { background: #fee2e2; border-color: var(--incorrect); }

        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        line { stroke: #cbd5e1; stroke-width: 3; }
        
        .controls { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; background: var(--primary); }
        .btn-check { background: var(--correct); }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center">Cladogram Builder: Click-to-Place</h2>
    <div id="matrixUI"></div>

    <div class="controls">
        <button onclick="scramble()">🔀 Scramble Columns</button>
        <button style="background:#64748b" onclick="toggleTotals()">📊 Toggle Analysis</button>
    </div>

    <div class="quiz-layout">
        <div class="banks">
            <div class="bank" id="bank-org">
                <p style="font-size:11px; font-weight:bold; color:#64748b">ORGANISMS</p>
                <div class="item" id="org-A" onclick="selectItem(this)" data-type="org">Org A</div>
                <div class="item" id="org-B" onclick="selectItem(this)" data-type="org">Org B</div>
                <div class="item" id="org-C" onclick="selectItem(this)" data-type="org">Org C</div>
                <div class="item" id="org-D" onclick="selectItem(this)" data-type="org">Org D</div>
                <div class="item" id="org-E" onclick="selectItem(this)" data-type="org">Org E</div>
            </div>
            <div class="bank" id="bank-trait" style="margin-top:15px">
                <p style="font-size:11px; font-weight:bold; color:#64748b">TRAITS</p>
                <div class="item" id="trait-1" onclick="selectItem(this)" data-type="trait">Backbone</div>
                <div class="item" id="trait-2" onclick="selectItem(this)" data-type="trait">Lungs</div>
                <div class="item" id="trait-3" onclick="selectItem(this)" data-type="trait">Hair</div>
                <div class="item" id="trait-4" onclick="selectItem(this)" data-type="trait">Claws</div>
            </div>
        </div>

        <div class="cladogram-panel">
            <svg>
                <line x1="50" y1="400" x2="650" y2="80" />
                <line x1="150" y1="350" x2="150" y2="60" />
                <line x1="280" y1="285" x2="280" y2="60" />
                <line x1="410" y1="215" x2="410" y2="60" />
                <line x1="540" y1="145" x2="540" y2="60" />
            </svg>

            <div class="slot" style="left:95px; top:15px" data-type="org" data-ans="org-A" onclick="placeItem(this)">Tip 1</div>
            <div class="slot" style="left:225px; top:15px" data-type="org" data-ans="org-C" onclick="placeItem(this)">Tip 2</div>
            <div class="slot" style="left:355px; top:15px" data-type="org" data-ans="org-E" onclick="placeItem(this)">Tip 3</div>
            <div class="slot" style="left:485px; top:15px" data-type="org" data-ans="org-D" onclick="placeItem(this)">Tip 4</div>
            <div class="slot" style="left:600px; top:80px" data-type="org" data-ans="org-B" onclick="placeItem(this)">Tip 5</div>

            <div class="slot" style="left:170px; top:340px" data-type="trait" data-ans="trait-1" onclick="placeItem(this)">Trait 1</div>
            <div class="slot" style="left:300px; top:275px" data-type="trait" data-ans="trait-2" onclick="placeItem(this)">Trait 2</div>
            <div class="slot" style="left:430px; top:205px" data-type="trait" data-ans="trait-3" onclick="placeItem(this)">Trait 3</div>
            <div class="slot" style="left:560px; top:135px" data-type="trait" data-ans="trait-4" onclick="placeItem(this)">Trait 4</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-check" onclick="checkAll()">Check My Answers</button>
        <button style="background:#64748b" onclick="location.reload()">Clear All</button>
    </div>
</div>

<script>
    const traits = ["Backbone", "Lungs", "Hair", "Claws"];
    const matrix = { 'A':[0,0,0,0], 'B':[1,1,1,1], 'C':[1,0,0,0], 'D':[1,1,1,0], 'E':[1,1,0,0] };
    let currentTraits = [...traits];
    let showTotals = false;
    let selectedEl = null;

    function render() {
        let html = `<table><tr><th>Organism</th>`;
        currentTraits.forEach(t => html += `<th>${t}</th>`);
        if(showTotals) html += `<th class="total-cell">Row Sum</th>`;
        html += `</tr>`;
        
        let colTotals = new Array(currentTraits.length).fill(0);
        Object.entries(matrix).forEach(([name, vals]) => {
            html += `<tr><td><strong>${name}</strong></td>`;
            let rSum = 0;
            currentTraits.forEach((t, i) => {
                let v = vals[traits.indexOf(t)];
                html += `<td>${v}</td>`;
                rSum += v; colTotals[i] += v;
            });
            if(showTotals) html += `<td class="total-cell">${rSum}</td>`;
            html += `</tr>`;
        });

        if(showTotals) {
            html += `<tr class="total-cell"><td>Trait Frequency</td>`;
            colTotals.forEach(c => html += `<td>${c}</td>`);
            html += `<td>-</td></tr>`;
        }
        document.getElementById('matrixUI').innerHTML = html + `</table>`;
    }

    function selectItem(el) {
        if(selectedEl) selectedEl.classList.remove('selected');
        if(selectedEl === el) { selectedEl = null; return; }
        selectedEl = el;
        el.classList.add('selected');
    }

    function placeItem(slot) {
        // If slot is filled, return item to bank
        if(slot.dataset.itemId) {
            const item = document.getElementById(slot.dataset.itemId);
            item.style.display = "block";
            slot.innerHTML = slot.dataset.origText;
            slot.classList.remove('filled', 'correct', 'incorrect');
            delete slot.dataset.itemId;
            return;
        }

        // If something is selected, place it
        if(selectedEl) {
            if(selectedEl.dataset.type !== slot.dataset.type) {
                alert("Wrong type! Put organisms on tips and traits on branches.");
                return;
            }
            slot.dataset.origText = slot.innerHTML;
            slot.innerHTML = selectedEl.innerHTML;
            slot.dataset.itemId = selectedEl.id;
            slot.classList.add('filled');
            selectedEl.style.display = "none";
            selectedEl.classList.remove('selected');
            selectedEl = null;
        }
    }

    function checkAll() {
        document.querySelectorAll('.slot').forEach(slot => {
            slot.classList.remove('correct', 'incorrect');
            if(slot.dataset.itemId) {
                if(slot.dataset.itemId === slot.dataset.ans) slot.classList.add('correct');
                else slot.classList.add('incorrect');
            }
        });
    }

    function scramble() { currentTraits.sort(() => Math.random() - 0.5); render(); }
    function toggleTotals() { showTotals = !showTotals; render(); }

    render();
</script>
</body>
</html>
