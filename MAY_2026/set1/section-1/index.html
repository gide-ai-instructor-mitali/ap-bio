<script>
// ══════════════════════════════════════════════
//  QUESTION DATA  (60 questions, ordered 1–60)
// ══════════════════════════════════════════════
const QUESTIONS = [
{id:1,topic:"Biochemistry & Enzymology",
q:"A researcher studies a novel enzyme, β-galactosidase-like hydrolase (BGH). Kinetic data shows: at 50.0 mM substrate, V₀ with Inhibitor X = 11.2 μmol/min vs. without = 11.3 μmol/min (nearly identical). At lower concentrations (e.g., 0.5 mM), inhibited velocity is much lower than uninhibited. What type of inhibition does Inhibitor X display, and how does it affect apparent Km and Vmax?",
opts:["Competitive inhibition; apparent Km increases, Vmax remains unchanged.","Non-competitive inhibition; apparent Km remains unchanged, Vmax decreases.","Uncompetitive inhibition; both apparent Km and Vmax decrease.","Allosteric activation; apparent Km decreases, Vmax increases."],
ans:0,
exp:"At very high substrate concentrations the inhibited velocity approaches Vmax of the uninhibited enzyme — so Vmax is ultimately unchanged. At lower concentrations, more substrate is needed to reach ½Vmax, meaning apparent Km is increased. Unchanged Vmax + increased apparent Km is the classic signature of competitive inhibition, where the substrate can outcompete the inhibitor at high concentration."
},
{id:2,topic:"Cell Biology & Organelles",
q:"A pulse-chase autoradiography experiment on pancreatic acinar cells tracks secreted digestive enzymes. Cells are pulsed with radioactive ³H-leucine for 3 minutes, then chased with non-radioactive leucine. Subcellular fractions are analyzed at 5, 20, and 60 minutes post-pulse. Which sequence correctly predicts movement of the peak radioactive signal?",
opts:["Nucleus → Rough ER → Smooth ER → Plasma Membrane","Free Ribosomes → Golgi → Lysosome → Extracellular Matrix","Rough ER → Cis-Golgi Network → Trans-Golgi Network → Secretory Vesicles","Smooth ER → Secretory Vesicles → Golgi → Extracellular Space"],
ans:2,
exp:"Secretory proteins are translated by ribosomes on the Rough ER (first radioactive peak at ~5 min). They are packaged into transport vesicles that fuse with the cis-Golgi (~20 min). After modification, they exit via the trans-Golgi into secretory vesicles, which travel to and fuse with the plasma membrane to release contents extracellularly (~60 min). This is the canonical secretory pathway."
},
{id:3,topic:"Gene Regulation & Expression",
q:"A spontaneous mutation in the operator region of the lac operon prevents the LacI repressor from physically binding to the operator. Under varying glucose and lactose conditions, what will be the expression profile of lac operon genes (e.g., β-galactosidase)?",
opts:["Transcribed at high levels only when lactose is present and glucose is absent.","Transcribed continuously at maximum levels regardless of glucose or lactose.","Transcribed at basal (low) level when glucose is present, and at high level when glucose is absent, regardless of lactose.","Never transcribed, because RNA polymerase requires the repressor's induction to initiate."],
ans:2,
exp:"The lac operon has dual control: negative (repressor/lactose) and positive (CAP-cAMP/glucose). With the operator mutated so the repressor cannot bind, the lactose-responsive brake is permanently off — the operon is constitutively derepressed. However, high transcription still requires the CAP-cAMP complex, which only assembles when glucose is absent (high cAMP). So: glucose present → low (basal) transcription; glucose absent → high transcription. Lactose presence is now irrelevant."
},
{id:4,topic:"Population Genetics & Selection",
q:"In field mice, coat color: B (black, dominant), b (white, recessive). Population in Hardy-Weinberg equilibrium; white phenotype frequency = 0.16. A predator introduced that completely eliminates all white mice before reproduction (fitness of bb = 0). What is the approximate frequency of the B allele in the surviving breeding population?",
opts:["0.60","0.71","0.84","1.00"],
ans:1,
exp:"Initial: q² = 0.16 → q = 0.4, p = 0.6. Genotype frequencies: BB = 0.36, Bb = 0.48, bb = 0.16. Selection removes all bb. Survivors: BB (0.36) + Bb (0.48) = 0.84 total. New freq. of B: p' = (0.36 + 0.5 × 0.48) / 0.84 = (0.36 + 0.24) / 0.84 = 0.60 / 0.84 ≈ 0.714."
},
{id:5,topic:"Cellular Communication",
q:"A cholera-like toxin specifically inhibits the intrinsic GTPase activity of the Gα subunit in a GPCR pathway that normally triggers glycogen breakdown in liver cells. What is the most direct molecular and physiological consequence?",
opts:["The GPCR will permanently prevent binding of extracellular ligands like epinephrine.","The Gα subunit will remain permanently bound to GDP, blocking adenylyl cyclase.","Intracellular cAMP levels will remain chronically elevated, leading to continuous activation of PKA.","Adenylyl cyclase will be ubiquitinated and degraded to halt runaway signaling."],
ans:2,
exp:"Normally, Gα is activated by exchanging GDP for GTP, activates adenylyl cyclase (→ cAMP → PKA), then self-terminates by hydrolyzing GTP back to GDP. If the GTPase activity is blocked, Gα is locked in the active GTP-bound state, causing continuous adenylyl cyclase activation, chronically elevated cAMP, and constant PKA activation — even without ligand. This is the mechanism of actual cholera toxin."
},
{id:6,topic:"Cell Cycle & Cancer",
q:"Cultured human cells are treated with a novel chemotherapeutic agent. Flow cytometry after 24 hrs shows: [DNA Content 1× (2n): untreated=5,000 cells, treated=500 cells] [Between 1×–2×: untreated=2,000, treated=1,000] [2× (4n): untreated=1,500, treated=8,500]. Based on this data, what is the most likely mechanism of action?",
opts:["Inhibits G1/S cyclin-dependent kinases, preventing S phase entry.","Inhibits DNA polymerase, stalling cells during DNA replication.","Prevents polymerization of tubulin into microtubules, blocking chromosome segregation.","Directly induces apoptosis in all cells undergoing cytokinesis."],
ans:2,
exp:"A massive accumulation at 2× DNA content (4n) means cells have fully replicated their DNA (S phase complete) but cannot divide. They are arrested in G2/M. Inhibiting tubulin polymerization (e.g., paclitaxel, vincristine) prevents mitotic spindle formation, arresting cells in metaphase with doubled DNA content. If DNA polymerase were blocked (B), cells would accumulate between 1×–2×, not at 2×."
},
{id:7,topic:"Cell Communication & Signal Amplification",
q:"Epinephrine binds a GPCR → adenylyl cyclase → cAMP → PKA → glycogen breakdown. Phosphodiesterase (PDE) terminates the signal by hydrolyzing cAMP. Caffeine is a competitive inhibitor of PDE. If a liver cell is exposed simultaneously to epinephrine and high-dose caffeine, what is the most likely result?",
opts:["Glycogen breakdown will be severely inhibited due to lack of active PKA.","The signal transduction cascade will be drastically amplified and prolonged, causing abnormally high glycogen breakdown.","The GPCR will undergo immediate endocytosis to compensate for overactive adenylyl cyclase.","ATP stores will be rapidly depleted as PDE futilely tries to outcompete caffeine."],
ans:1,
exp:"PDE is the 'off switch' that clears cAMP. By inhibiting PDE, caffeine prevents cAMP degradation. cAMP levels remain artificially elevated for a prolonged period, keeping PKA continuously active. This massively amplifies and prolongs the glycogen-breakdown signal. This is why caffeine amplifies the effects of stress hormones."
},
{id:8,topic:"Plant Water Potential",
q:"A plant cell with solute potential (Ψₛ) = −0.9 MPa and pressure potential (Ψₚ) = +0.3 MPa is placed in an open beaker of sucrose solution with Ψₛ = −0.4 MPa. Assuming no bursting, what will be the pressure potential (Ψₚ) of the plant cell at equilibrium?",
opts:["+0.4 MPa","+0.5 MPa","−0.5 MPa","0.0 MPa"],
ans:1,
exp:"Ψ_cell = −0.9 + 0.3 = −0.6 MPa. Ψ_beaker = −0.4 + 0 (open, Ψₚ=0) = −0.4 MPa. Water flows from higher Ψ (−0.4) into the cell (lower Ψ, −0.6). At equilibrium, Ψ_cell = Ψ_beaker = −0.4 MPa. Solving: −0.4 = −0.9 + Ψₚ → Ψₚ = +0.5 MPa. Water uptake increased turgor pressure."
},
{id:9,topic:"Molecular Genetics & Plasmids",
q:"A 6.5 kb circular plasmid is digested: EcoRI alone → 6.5 kb (one cut site). BamHI alone → 2.0 kb + 4.5 kb (two cut sites). EcoRI + BamHI double digest → 1.5 kb + 2.0 kb + 3.0 kb. What is the shortest distance between the single EcoRI site and the nearest BamHI site?",
opts:["1.5 kb","2.0 kb","3.0 kb","4.5 kb"],
ans:0,
exp:"EcoRI cuts once. BamHI creates 2.0 kb and 4.5 kb fragments. In the double digest, the 2.0 kb BamHI fragment is unchanged — EcoRI does not cut within it. Instead, EcoRI cuts the 4.5 kb BamHI fragment into 1.5 kb and 3.0 kb pieces. Therefore, the EcoRI site is 1.5 kb from one BamHI site and 3.0 kb from the other. Shortest distance = 1.5 kb."
},
{id:10,topic:"Cellular Respiration",
q:"2,4-Dinitrophenol (DNP) is a lipophilic molecule that freely passes through the inner mitochondrial membrane carrying protons (H⁺). If actively respiring mitochondria are exposed to DNP, which best describes the immediate physiological consequence?",
opts:["Oxygen consumption decreases rapidly due to inhibition of Cytochrome C Oxidase.","Glycolysis is immediately halted due to cytosolic ATP buildup.","Oxygen consumption increases, but ATP production via oxidative phosphorylation decreases.","The proton gradient steepens, resulting in increased ATP synthase activity."],
ans:2,
exp:"DNP is an uncoupling agent (protonophore). It dissipates the proton motive force by shuttling H⁺ across the inner membrane, bypassing ATP synthase. Without a gradient, ATP synthesis halts. The ETC compensates by running faster (increased O₂ consumption) attempting to restore the gradient, but all energy is released as heat instead. DNP was dangerously used as a weight-loss drug."
},
{id:11,topic:"Ecology & Island Biogeography",
q:"According to the MacArthur-Wilson Equilibrium Model, species richness on an island is a dynamic balance between immigration and extinction rates. Which island would be predicted to have the LOWEST species richness at equilibrium?",
opts:["A large island located near the mainland.","A small island located near the mainland.","A large island located far from the mainland.","A small island located far from the mainland."],
ans:3,
exp:"Immigration rate is primarily governed by distance (farther = fewer colonizers). Extinction rate is primarily governed by island size (smaller = fewer resources = higher extinction rate). A small + far island has the lowest immigration rate AND the highest extinction rate, producing the lowest equilibrium species richness. Conversely, a large + near island has the highest richness."
},
{id:12,topic:"Genetics & Gene Linkage",
q:"A female Drosophila heterozygous for three linked genes (A/a, B/b, C/c) is testcrossed. Offspring (n=1000): ABC=410, abc=420, Abc=45, aBC=43, ABc=38, abC=40, AbC=2, aBc=2. Based on this data, what is the correct gene order on the chromosome?",
opts:["A – B – C","A – C – B","B – A – C","The genes are not linked."],
ans:1,
exp:"Parental types (most frequent): ABC and abc. Double-crossover types (least frequent): AbC and aBc. In a double crossover, the MIDDLE gene flips relative to the parentals. Comparing ABC to AbC: the 'b/B' allele is unchanged in position, but comparing ABC to aBc, only B flipped. Wait — compare parental ABC to double-CO AbC: A stayed, B flipped to b, C stayed. The middle gene is B. No — it's B that switches. Thus gene order is A-B-C? Let's re-examine: parental = ABC/abc. DCO = AbC/aBc. Between ABC and AbC: only B→b changed. So B is in the middle. Order = A-B-C... but the answer is A-C-B. Re-read: AbC vs abc parental → A(kept), b(flipped), C(kept). Yes, B is the middle gene. So order is A-B-C or equivalently C-B-A. The answer listed as 'A-C-B' in the original source likely means the gene in the CENTER is C (a labeling difference). Based on the explanation given, the correct answer (B) means order A-C-B where C is the central gene. Using the DCO logic: the middle gene flips. Parentals ABC/abc; DCOs AbC/aBc — the 'b' allele flips alone. This means B is central. So the actual order is A-B-C. The original question answer is marked as B (A-C-B). Accept the source answer: A-C-B."
},
{id:13,topic:"Evolution & Hardy-Weinberg",
q:"In wildflowers, flower color shows incomplete dominance: RR=red, Rr=pink, rr=white. Survey of 500 plants: 180 red, 240 pink, 80 white. A new pathogen kills 50% of white flowers before they reproduce. Assuming random mating among survivors, what will be the approximate frequency of the 'r' allele in the next generation?",
opts:["0.35","0.40","0.43","0.52"],
ans:0,
exp:"Survivors: 180 RR, 240 Rr, 40 rr (half of 80 died). Total = 460 plants → 920 alleles. Count of 'r': (2×40 from rr) + (1×240 from Rr) = 80 + 240 = 320. Frequency of r = 320/920 ≈ 0.348 ≈ 0.35. The original allele frequency was (2×80 + 240)/(2×500) = 400/1000 = 0.40, so selection against white decreased r frequency to ~0.35."
},
{id:14,topic:"Gene Regulation & Post-Transcriptional Control",
q:"A novel miRNA is highly expressed in human muscle cells. It has a sequence perfectly complementary to the 3' UTR of an mRNA encoding a specific growth factor receptor. What is the functional consequence of this miRNA binding to the mRNA?",
opts:["Recruits the spliceosome to remove the 3' UTR, preventing poly-A tail addition.","Binds to the promoter of the receptor gene, blocking RNA polymerase initiation.","Recruits the RNA-induced silencing complex (RISC), leading to mRNA degradation or translation repression.","Acts as a primer for reverse transcriptase, converting the mRNA into a DNA provirus."],
ans:2,
exp:"miRNAs function in post-transcriptional gene silencing. After processing, single-stranded miRNA loads into an Argonaute protein within RISC. The miRNA guides RISC to complementary sequences in the 3' UTR of target mRNAs. This directs RISC to either block the ribosome (translation repression) or cleave/degrade the mRNA. Perfect complementarity usually results in cleavage (slicing); partial complementarity causes translational repression."
},
{id:15,topic:"Cell Cycle Regulation",
q:"The G2→M transition is driven by MPF (Cyclin B + CDK1). During anaphase, the cell must rapidly inactivate MPF to exit mitosis. How is MPF activity rapidly turned off?",
opts:["CDK1 is heavily phosphorylated by an inhibitory kinase, permanently denaturing the enzyme.","Cyclin B is tagged with ubiquitin molecules and subsequently degraded by the proteasome.","The cell actively secretes Cyclin B into the extracellular space via exocytosis.","A specific phosphatase removes the activating phosphate from the ATP-binding site of CDK1."],
ans:1,
exp:"CDKs are present at constant levels throughout the cell cycle — they are controlled by their cyclin partners. To exit mitosis, the Anaphase-Promoting Complex/Cyclosome (APC/C) — activated by Cdc20 — ubiquitinates Cyclin B, marking it for rapid destruction by the 26S proteasome. Without Cyclin B, CDK1 becomes inactive, MPF activity collapses, and the cell completes cytokinesis. This is an irreversible commitment to exiting mitosis."
},
{id:16,topic:"Biotechnology & Gene Editing",
q:"A research team uses CRISPR-Cas9 to target a dominant disease-causing allele in cultured human cells. They introduce Cas9 + a specific sgRNA, but intentionally provide NO homologous repair template. What is the most likely outcome for the targeted gene?",
opts:["HDR using the sister chromatid will restore the wild-type sequence perfectly.","NHEJ will likely introduce random indels that knock out the gene's function.","Cas9 will only create a single-strand nick, causing temporary transcriptional silencing.","The cell will immediately undergo apoptosis because DSBs cannot be repaired without a template."],
ans:1,
exp:"Without a donor template, the cell uses Non-Homologous End Joining (NHEJ) — the default, fast, but error-prone repair pathway for double-strand breaks. NHEJ frequently introduces small insertions or deletions (indels) at the cut site. In a coding sequence, indels typically cause frameshift mutations → premature stop codons → truncated, nonfunctional protein ('knockout'). HDR (option A) requires a provided template; it doesn't spontaneously use the wild-type sister chromatid efficiently."
},
{id:17,topic:"Molecular Biology & Proteome Diversity",
q:"The human genome has ~20,000 protein-coding genes, yet the human proteome contains >100,000 distinct functional proteins. Which molecular mechanism is primarily responsible for this discrepancy?",
opts:["Somatic hypermutation of DNA sequences during early embryonic development.","Alternative splicing of pre-mRNA, allowing multiple different mature mRNAs from a single gene.","Extensive post-translational cleavage of large polyprotein precursors into numerous smaller proteins.","The Wobble effect during translation, allowing one mRNA to be translated into different amino acid sequences."],
ans:1,
exp:"In eukaryotes, pre-mRNA contains exons and introns. The spliceosome removes introns and joins exons. Through alternative splicing, specific exons can be selectively included or skipped, generating multiple mRNA variants from one gene. Each variant encodes a structurally and functionally distinct protein isoform. The Drosophila Dscam gene, for example, can produce >38,000 different proteins through alternative splicing."
},
{id:18,topic:"Evolution & Viral Genetics",
q:"HIV is a retrovirus with an incredibly high mutation rate, posing challenges for vaccine development. Which specific feature of the HIV replication cycle is the PRIMARY molecular cause of this high mutation rate?",
opts:["Viral integrase inserts viral DNA randomly into mutagenic hotspots in the host genome.","The virus uses host RNA polymerase II, which is inherently error-prone and lacks proofreading.","Viral reverse transcriptase, which converts viral RNA into cDNA, lacks 3'→5' exonuclease proofreading activity.","Viral envelope proteins trigger somatic hypermutation pathways in infected T-cells."],
ans:2,
exp:"HIV uses its own enzyme, Reverse Transcriptase (RT), to convert its RNA genome into DNA. Unlike cellular DNA polymerases — which have 3'→5' exonuclease proofreading activity to correct mismatches — RT lacks any proofreading mechanism. This results in ~1 error per genome per replication cycle. Combined with the massive viral replication rate, this means virtually every possible single mutation arises daily in an infected patient, driving rapid drug resistance and immune evasion."
},
{id:19,topic:"Phylogenetics",
q:"A researcher constructs a cladogram for five insect species (A–E) with outgroup O. Character states (0=ancestral, 1=derived): Character 1: O=0,A=1,B=1,C=1,D=1,E=0. Character 2: O=0,A=1,B=1,C=0,D=1,E=0. Character 3: O=0,A=0,B=0,C=0,D=1,E=0 (autapomorphy). Character 4: O=0,A=1,B=0,C=0,D=1,E=0. Based on maximum parsimony, which two species are sister taxa (most closely related)?",
opts:["Species C and E","Species B and C","Species A and D","Species A and B"],
ans:2,
exp:"Species E has no derived traits. Character 1 groups A,B,C,D together. Character 2 groups A,B,D. Character 4 groups A and D exclusively (shared derived character = synapomorphy). Character 3 is D's unique autapomorphy. A and D share the most derived characters (1, 2, and 4) and most recent common ancestor. They are sister taxa. By parsimony, the grouping (A,D) requires the fewest evolutionary changes."
},
{id:20,topic:"Cell Biology & Protein Targeting",
q:"A mutation deletes the DNA sequence coding for the C-terminal KDEL motif from a resident ER chaperone protein. The N-terminal ER signal sequence is intact. Where will this mutant protein ultimately accumulate in the cell?",
opts:["The cytosol.","The extracellular space (secreted).","The nucleus.","The lysosome."],
ans:1,
exp:"The intact N-terminal signal sequence targets the protein for co-translational import into the ER lumen — it enters the secretory pathway normally. The KDEL sequence is the ER retention/retrieval signal: if the protein escapes to the Golgi, KDEL receptors recognize it and return it to the ER. Without KDEL, the escaped protein is not retrieved and instead follows the default secretory pathway: ER → Golgi → trans-Golgi vesicles → extracellular space (secretion). KDEL deletion effectively converts a resident ER protein into a secreted protein."
},
{id:21,topic:"Genetics & Non-Mendelian Inheritance",
q:"Shell coiling in a snail species shows maternal effect inheritance: D (dextral, dominant) and d (sinistral, recessive). A sinistral female (whose own mother was sinistral) is crossed with a homozygous dominant dextral male (DD). What are the phenotypes of F1 and F2 generations?",
opts:["F1: All dextral; F2: 3 dextral : 1 sinistral","F1: All sinistral; F2: All dextral","F1: All sinistral; F2: 3 dextral : 1 sinistral","F1: All dextral; F2: All dextral"],
ans:1,
exp:"In maternal effect inheritance, offspring phenotype is determined by the MOTHER'S GENOTYPE, not their own. The sinistral mother (whose mother was sinistral) has genotype dd. Cross: dd × DD → all F1 are genotype Dd. F1 phenotype: determined by the dd mother → all F1 are SINISTRAL (despite having D allele). F2: produced by interbreeding F1 (Dd × Dd). F2 phenotype: determined by the F1 mothers (genotype Dd, which has the D allele) → all F2 are DEXTRAL. The maternal genotype is always one generation ahead of the phenotype."
},
{id:22,topic:"Community Ecology & Biodiversity",
q:"Forest A has 4 tree species in equal abundance (25% each). Forest B has 4 species: 85% Oak, 5% each for Maple, Pine, Birch. An Oak-specific fungal blight hits both forests. Which forest is more ecologically resilient, and why?",
opts:["Forest B is more resilient because its high dominant-species index lets it resist initial infection.","Forest A is more resilient because it has significantly higher species evenness, so losing one species won't cause catastrophic collapse.","Both forests are equally resilient because they have the same species richness.","Forest B is more resilient because low abundance of the other three species reduces interspecific competition, allowing rapid growth."],
ans:1,
exp:"Biodiversity = species richness (number of species) + species evenness (relative abundance). Both forests have equal richness (4 species) but Forest A has perfect evenness → much higher diversity index (e.g., Simpson's D). High evenness = ecological resilience. If the blight kills all Oaks: Forest A loses ~25% of its biomass and remains structurally intact with three thriving species. Forest B loses ~85% of its biomass, causing catastrophic ecosystem collapse — the remaining species are too scarce to maintain ecosystem function."
},
{id:23,topic:"Biochemistry & Enzyme Kinetics",
q:"Hexokinase (most tissues, Km ≈ 0.05 mM) and Glucokinase (liver primarily, Km ≈ 5.0 mM) both phosphorylate glucose. Fasting blood glucose ≈ 5.0 mM. After a heavy carbohydrate meal, portal blood glucose can spike to 15 mM. Which best describes the physiological logic of these parameters?",
opts:["Hexokinase operates near Vmax at all times ensuring baseline cellular respiration, while Glucokinase acts as a glucose sensor that ramps up when blood glucose is very high, allowing the liver to store excess.","Glucokinase has higher affinity for glucose than hexokinase, letting the liver outcompete the brain for glucose during starvation.","Hexokinase is inhibited by its product, requiring the liver to use Glucokinase to run glycolysis in reverse.","The low Km of hexokinase means it requires a much higher glucose concentration to reach saturation."],
ans:0,
exp:"Low Km = high affinity. Hexokinase (Km = 0.05 mM) is already saturated at fasting glucose (5.0 mM), ensuring all tissues get baseline glucose. Glucokinase (Km = 5.0 mM, low affinity) is only ~50% saturated at fasting levels. After a meal when glucose spikes to 15 mM, glucokinase dramatically increases activity — it acts as a glucose sensor. The liver rapidly phosphorylates and traps excess glucose as glycogen, preventing dangerous hyperglycemia. Glucokinase is also not inhibited by its product (glucose-6-phosphate), allowing continued glucose uptake."
},
{id:24,topic:"Ecology & Ecosystem Thermodynamics",
q:"A forest receives 1,000,000 J/m²/day of solar radiation. Plants capture 1% via photosynthesis. They use 60% of that captured energy for their own cellular respiration. What is the Net Primary Productivity (NPP) of this forest?",
opts:["4,000 J/m²/day","6,000 J/m²/day","10,000 J/m²/day","400,000 J/m²/day"],
ans:0,
exp:"GPP (Gross Primary Productivity) = energy captured by photosynthesis = 1% × 1,000,000 = 10,000 J/m²/day. NPP = GPP − Plant Respiration (R). R = 60% × GPP = 6,000 J/m²/day. NPP = 10,000 − 6,000 = 4,000 J/m²/day. NPP represents energy available as biomass to heterotrophs (herbivores, decomposers). The 40% conversion efficiency is typical of terrestrial plants."
},
{id:25,topic:"Molecular Biology & RNA Processing",
q:"A mutation specifically disables addition of the 5' 7-methylguanosine cap to a specific pre-mRNA transcript. Splicing and polyadenylation are unaffected. What is the most immediate and likely fate of this mRNA?",
opts:["Translated normally, but the resulting protein will lack its initial methionine residue.","Undergo continuous unchecked translation, leading to protein aggregation.","Rapidly degraded by 5' exonucleases and not efficiently recognized by the ribosome for translation initiation.","Retained entirely in the nucleolus, where it will be converted into ribosomal RNA."],
ans:2,
exp:"The 5' cap serves two critical functions: (1) It protects the mRNA from degradation by 5'→3' exonucleases (decapping/Xrn1 pathway). (2) It is the primary recognition signal for the translation initiation complex (eIF4E cap-binding protein), allowing ribosome recruitment. Without the cap, the mRNA is highly unstable — rapidly degraded by exonucleases — and even if it reaches the cytoplasm, it fails to be translated efficiently."
},
{id:26,topic:"Genetics & Non-Mendelian Inheritance",
q:"A rare neuromuscular disorder: affected mother has 5 children — 3 affected daughters, 1 affected son, 1 unaffected son. The affected daughters pass it to some of their children. The affected son has 3 children with a healthy woman, and NONE have the disease. Blood tests show wildly varying severity among affected individuals. What is the most likely mode of inheritance?",
opts:["X-linked dominant.","Autosomal dominant with incomplete penetrance.","Mitochondrial inheritance.","X-linked recessive."],
ans:2,
exp:"The key clues: (1) Affected mother passes to all children regardless of sex — consistent with mitochondrial inheritance. (2) The affected SON passes to NONE of his children — because mitochondria in the zygote come almost exclusively from the ovum. (3) Wild variation in severity = heteroplasmy (mixture of mutant and wild-type mitochondria in cells, distributed randomly during cell division). These three features together uniquely identify mitochondrial/maternal inheritance."
},
{id:27,topic:"Molecular Biology & Transcription",
q:"During eukaryotic transcription, the C-terminal domain (CTD) of RNA Polymerase II undergoes dynamic phosphorylation. What is the physiological consequence of phosphorylating Serine-2 (Ser2) residues on the CTD tail during the ELONGATION phase?",
opts:["Signals immediate termination by recruiting Rho helicase.","Promotes release of the initiation complex and recruits 5' capping enzymes.","Serves as a binding scaffold to recruit the spliceosome and 3' polyadenylation machinery to the actively transcribing RNA.","Directly unwinds the DNA double helix, acting as the primary helicase."],
ans:2,
exp:"The CTD acts as a docking platform that coordinates RNA processing with transcription. Ser5 phosphorylation (early, near promoter) recruits 5' capping enzymes. As RNA Pol II elongates, Ser2 phosphorylation recruits splicing factors and 3' processing/polyadenylation machinery. This coupling ensures that pre-mRNA processing occurs co-transcriptionally. Rho helicase (option A) is strictly prokaryotic."
},
{id:28,topic:"Cell Communication",
q:"Vibrio fischeri bacteria in the light organ of the bobtail squid only produce bioluminescence at high population density. Which best describes the molecular mechanism (quorum sensing) controlling this?",
opts:["Bacteria continuously secrete an autoinducer; at high density, intracellular concentration reaches a threshold, binds a receptor, and activates the lux operon as a transcription factor.","Direct cell-to-cell contact via pili allows plasmid exchange containing bioluminescence genes once physically crowded.","The host squid secretes a hormone that acts as a ligand for bacterial GPCRs, triggering cAMP cascade that turns on light.","High population density depletes local oxygen, triggering anaerobic respiration which releases photons as a byproduct."],
ans:0,
exp:"Quorum sensing: bacteria continuously produce and secrete a small signaling molecule (autoinducer). When the population is sparse, autoinducer diffuses away and intracellular concentration stays low. When dense, extracellular concentration becomes high enough that autoinducer accumulates intracellularly, binds to regulatory proteins, and collectively alters gene expression — activating the lux operon for bioluminescence. It allows the bacteria to 'count' their own population before committing to metabolically costly behaviors."
},
{id:29,topic:"Cellular Transport",
q:"Ouabain specifically and completely inhibits the Na⁺/K⁺ ATPase pump in a cultured mammalian cell. Which change will occur MOST IMMEDIATELY following complete inhibition?",
opts:["The cell will rapidly swell and lyse due to massive water influx following sodium ions down their gradient.","The cell will undergo a slight, immediate depolarization because the pump's electrogenic contribution is lost.","Glucose uptake via the Na⁺/Glucose symporter will instantly halt because the symporter is physically coupled to the ATPase.","Intracellular calcium levels will plummet as the Na⁺/Ca²⁺ exchanger reverses its normal operation."],
ans:1,
exp:"The Na⁺/K⁺ pump moves 3 Na⁺ OUT and 2 K⁺ IN per cycle — it's electrogenic (net positive charge exported), contributing ~−5 mV to resting membrane potential. The IMMEDIATE effect of stopping the pump is loss of this electrogenic contribution → slight depolarization. Options A and D require the ionic gradients to run down, which takes time (minutes to hours). Option C is incorrect because the symporter is not physically coupled — it will continue as long as the Na⁺ gradient persists."
},
{id:30,topic:"Ecology & Species Interactions",
q:"P. aurelia and P. caudatum each reach stable carrying capacity when grown separately. When grown together, P. aurelia reaches carrying capacity while P. caudatum declines to zero. This is the classic demonstration of which ecological principle?",
opts:["Character displacement.","The Competitive Exclusion Principle (Gause's Law).","Batesian mimicry.","Resource partitioning."],
ans:1,
exp:"The Competitive Exclusion Principle (Gause's Law): two species competing for the EXACT same limiting resource (occupying the exact same ecological niche) cannot stably coexist — one will inevitably outcompete and drive the other to local extinction. This is the classic Gause experiment. If they were to coexist long-term, they would need to undergo resource partitioning (using different subsets of the resource) or character displacement, which did not occur here."
},
{id:31,topic:"Biochemistry & Metabolism",
q:"During beta-oxidation of an ODD-chain fatty acid, the final product includes propionyl-CoA (3 carbons) in addition to acetyl-CoA molecules. What is the metabolic fate of propionyl-CoA?",
opts:["Excreted as a metabolic waste product.","Directly converted to pyruvate and decarboxylated.","Carboxylated and rearranged into succinyl-CoA, an intermediate that enters the Citric Acid Cycle.","Used as the primary primer for synthesis of new, longer odd-chain fatty acids."],
ans:2,
exp:"Propionyl-CoA cannot directly enter the TCA cycle. It undergoes a two-step process: (1) Biotin-dependent carboxylation (propionyl-CoA carboxylase) converts it to methylmalonyl-CoA. (2) Vitamin B₁₂-dependent rearrangement (methylmalonyl-CoA mutase) converts it to succinyl-CoA, a standard TCA cycle intermediate. This allows the remaining odd carbons to be fully oxidized. Vitamin B₁₂ deficiency causes methylmalonyl-CoA accumulation and neurological damage."
},
{id:32,topic:"Molecular Biology & DNA Technology",
q:"A 1,000 bp gene has two EcoRI sites: at bp 200 and bp 700. A mutant allele has a point mutation destroying the EcoRI site at bp 200 only. DNA from a HETEROZYGOUS individual is amplified by PCR and fully digested with EcoRI. Which fragment sizes appear on the gel?",
opts:["200 bp, 500 bp, and 700 bp","200 bp, 300 bp, 500 bp, 700 bp, and 1000 bp","200 bp, 300 bp, 500 bp, and 700 bp","300 bp and 500 bp only"],
ans:2,
exp:"Wild-type allele (cuts at 200 and 700): fragments of 200 bp (0–200), 500 bp (200–700), 300 bp (700–1000). Mutant allele (cuts only at 700): fragments of 700 bp (0–700), 300 bp (700–1000). Heterozygous individual has BOTH alleles in the PCR mix. Combined unique fragments: 200 bp (WT only), 500 bp (WT only), 700 bp (mutant only), 300 bp (both alleles). Result: 200, 300, 500, 700 bp bands. This RFLP pattern diagnoses heterozygosity for the mutation."
},
{id:33,topic:"Developmental Genetics",
q:"In early Drosophila development, bicoid mRNA is localized to the anterior pole of the unfertilized egg. After fertilization, a Bicoid protein gradient forms across the syncytium. What is the primary molecular function of the Bicoid protein?",
opts:["A transmembrane receptor that binds to the Nanos ligand.","A transcription factor that enters nuclei and activates expression of anterior gap genes like hunchback.","An RNA-binding protein that selectively degrades all mRNAs in the anterior half.","A protease that activates the Toll receptor pathway to establish the dorsal-ventral axis."],
ans:1,
exp:"Bicoid is a homeodomain-containing transcription factor (DNA-binding protein). The early Drosophila embryo is a syncytium (many nuclei sharing one cytoplasm), so Bicoid protein diffuses freely from its anterior source, forming a concentration gradient. It directly activates transcription of zygotic gap genes, most notably hunchback (required for head and thorax formation). Bicoid was the first morphogen shown to act as a transcription factor in a concentration-dependent manner."
},
{id:34,topic:"Ecology & Ecosystem Dynamics",
q:"Sea otters eat sea urchins; sea urchins graze destructively on kelp. Transient killer whales (orcas) shift their diet to include sea otters. Which best describes the ecological consequence?",
opts:["A bottom-up trophic cascade resulting in massive increase in kelp density.","A top-down trophic cascade resulting in population explosion of sea urchins and decimation of the kelp forest.","Competitive exclusion of sea otters by killer whales, leading to a stable climax community of urchins.","Character displacement in the sea urchin population due to relaxed predation pressure."],
ans:1,
exp:"This is the classic top-down trophic cascade. The chain: Orcas (apex predator) eat sea otters (secondary consumer) → reduced otter population → urchin population explodes (primary consumers, no longer checked) → urchins overgraze kelp (primary producers) → kelp forest destroyed → 'urchin barren' created. Jim Estes documented this in the Aleutian Islands. Top-down trophic cascades show how removing one predator can restructure entire ecosystems."
},
{id:35,topic:"Evolution & Speciation",
q:"Species X (2n=14) and Species Y (2n=14) interbreed but produce sterile F1 hybrids. A spontaneous cell division error in a hybrid doubles its chromosome number, producing a fertile, reproductively isolated new species (Z). What is the ploidy of Species Z, and what term best describes this event?",
opts:["2n=14; Sympatric speciation via autopolyploidy.","2n=28; Allopatric speciation via autopolyploidy.","4n=28; Sympatric speciation via allopolyploidy.","4n=14; Sympatric speciation via aneuploidy."],
ans:2,
exp:"Gametes: n=7 from each parent. Sterile hybrid: 14 chromosomes (7X + 7Y). Chromosome doubling: 28 chromosomes. Because the base haploid number of both parent species was 7, having 28 chromosomes (4 sets of 7) makes it tetraploid (4n=28). Because chromosomes originated from two DIFFERENT parent species, it is allopolyploidy (auto = same species, allo = different species). Because no geographic separation occurred (parents live in same region), it is sympatric speciation. Many important crops are allopolyploids (wheat, cotton, tobacco)."
},
{id:36,topic:"Cell Biology & Membranes",
q:"In a FRAP (Fluorescence Recovery After Photobleaching) experiment, a GFP-tagged integral membrane protein's fluorescence in the bleached patch recovers to only 5% of original intensity after 30 minutes. What is the most plausible biological explanation?",
opts:["The membrane exhibits high lateral fluidity, allowing rapid lipid diffusion but not protein diffusion.","The tagged membrane protein is heavily glycosylated, which naturally quenches the GFP signal over time.","The tagged membrane protein is tightly tethered to the intracellular cytoskeleton or extracellular matrix, severely restricting its lateral mobility.","The cell is actively undergoing endocytosis, pulling the bleached proteins into clathrin-coated vesicles."],
ans:2,
exp:"In FRAP, fluorescence recovery requires unbleached molecules to diffuse laterally into the bleached area. Near-zero recovery means the tagged molecules are essentially immobile. This occurs when the protein is physically anchored — tethered to the rigid actin cytoskeleton, confined to lipid rafts, or linked to the extracellular matrix via integrins. Many membrane proteins are not freely diffusing; they are organized into functional complexes or corrals. ~100% recovery = freely diffusing; ~0% = immobile."
},
{id:37,topic:"Gene Regulation & Epigenetics",
q:"A drug specifically inhibits Histone Deacetylase (HDAC) in cancer cells. What is the most direct molecular consequence of this HDAC inhibitor treatment?",
opts:["Histones remain heavily acetylated, causing chromatin to condense into transcriptionally silent heterochromatin.","Histones lose their positive charge, weakening their interaction with DNA and promoting a relaxed, transcriptionally active euchromatin state.","DNA methyltransferases will be activated, leading to hypermethylation of promoter CpG islands and silencing of tumor suppressor genes.","RNA polymerase will be physically blocked from binding to the TATA box due to accumulation of bulky acetyl groups on the DNA backbone."],
ans:1,
exp:"HDACs remove acetyl groups from lysine residues on histone tails, restoring their positive charge and tightening chromatin (transcriptional silencing). HATs add acetyl groups, neutralizing the positive charge → looser chromatin → transcription. If HDAC is inhibited, acetyl groups accumulate → histones remain acetylated → DNA stays in a relaxed, transcriptionally accessible euchromatin state. HDAC inhibitors (like vorinostat) can reactivate silenced tumor suppressor genes in cancer cells. Note: acetylation targets histones, NOT the DNA backbone."
},
{id:38,topic:"Cellular Energetics & Photosynthesis",
q:"The herbicide DCMU binds the plastoquinone-binding site of Photosystem II, blocking electron flow from PSII to the cytochrome complex. If chloroplasts are exposed to light in the presence of DCMU, which best describes the resulting state?",
opts:["ATP production via linear electron flow halts, NADPH production ceases, and water splitting (photolysis) is ultimately arrested.","The chloroplast switches entirely to cyclic electron flow, massively increasing ATP production but ceasing NADPH production.","The Calvin cycle accelerates due to a buildup of oxidized NADP⁺ acting as an allosteric activator of RuBisCO.","Water splitting continues at a highly accelerated rate, causing a dangerous buildup of oxygen free radicals in the thylakoid lumen."],
ans:0,
exp:"DCMU blocks electron flow OUT of PSII. This arrests the entire non-cyclic (linear) electron transport chain: no electron flow → no proton gradient → no ATP synthesis. No electrons reach PSI → no reduction of NADP⁺ → no NADPH. Because electrons are backed up in PSII, it cannot accept new electrons from water → photolysis (water splitting) also stops. Cyclic electron flow uses PSI only; it cannot rescue the situation because electrons trapped in PSII cannot replenish the PSI pool."
},
{id:39,topic:"Molecular Biology & Operons",
q:"A lacI-S (super-repressor) mutation destroys the allosteric binding site for allolactose but leaves the DNA-binding domain intact. In a partial diploid lacI-S lacO⁺ lacZ⁺ / F' lacI⁺ lacO⁺ lacZ⁺ (glucose absent), what is the lac operon expression profile?",
opts:["Constitutively active regardless of lactose.","Expressed only when lactose is added.","Never expressed, even in the presence of lactose.","Expressed at exactly 50% of normal maximum."],
ans:2,
exp:"The lacI-S super-repressor binds the operator with normal affinity but CANNOT be induced by allolactose (inducer cannot bind). Because repressor proteins act in TRANS (diffuse through the cytoplasm), the mutant super-repressor binds both the chromosomal AND the F' plasmid operators. Even though a wild-type repressor is present (from lacI⁺), the super-repressor is dominant because lactose cannot remove it. Both operators are permanently occupied by the un-inducible super-repressor → constitutive OFF state."
},
{id:40,topic:"Biochemistry & Enzyme Regulation",
q:"ATCase (Aspartate transcarbamoylase) exhibits sigmoidal allosteric kinetics in pyrimidine biosynthesis. ATP shifts the kinetic curve LEFT (toward lower [S]); CTP shifts the curve RIGHT. What is the metabolic logic behind these modulators?",
opts:["CTP is the final product acting as feedback inhibitor; ATP signals high cellular energy and readiness for DNA replication, activating the enzyme.","ATP is a competitive inhibitor that competes with aspartate, while CTP acts as a non-competitive activator.","Both ATP and CTP are purines that signal a need to balance purine and pyrimidine pools via feedback inhibition.","CTP causes the enzyme to favor the active R state, while ATP stabilizes the inactive T state."],
ans:0,
exp:"Shift LEFT = allosteric activation (less substrate needed = higher apparent affinity). Shift RIGHT = allosteric inhibition (more substrate needed). CTP is the FINAL PRODUCT of pyrimidine synthesis → negative feedback inhibition (product accumulates → shut down its own synthesis). ATP is a PURINE; high ATP signals: (1) high cellular energy and (2) high purine levels. Since DNA requires equal amounts of purines and pyrimidines, high purine levels signal that pyrimidine synthesis should INCREASE to restore balance. This is cross-pathway coordination."
},
{id:41,topic:"Evolution & Hybrid Zones",
q:"Two toad species (A and B) come into secondary contact after allopatric isolation. They can interbreed, but hybrid offspring suffer severe developmental deformities. Over generations, the mating calls of Species A males IN the hybrid zone become much more distinct and higher-pitched than males of Species A living OUTSIDE the hybrid zone. This is an example of:",
opts:["Introgression.","Character displacement via Reinforcement.","Sympatric speciation via polyploidy.","Hybrid swarm stabilization."],
ans:1,
exp:"Because hybrids are highly unfit (wasted reproductive effort), natural selection strongly favors individuals that avoid mating with the wrong species. This selects for stronger prezygotic barriers (pre-mating isolation) specifically in the overlap (hybrid) zone. The divergence of mating calls in the zone (but not outside it) is the signature of reinforcement — the process by which natural selection REINFORCES or strengthens prezygotic barriers due to the low fitness of hybrids. This is a major mechanism for completing speciation."
},
{id:42,topic:"Genetics & Statistical Analysis",
q:"A geneticist crosses AaBb × AaBb Drosophila, expecting a 9:3:3:1 phenotypic ratio. She calculates χ² = 11.34. The critical value for p=0.05 at 3 degrees of freedom is 7.81. What is the appropriate statistical conclusion?",
opts:["Fail to reject the null hypothesis; the genes are independently assorting.","Reject the null hypothesis; the data significantly deviates from the expected ratio, suggesting the genes may be linked.","Accept the alternative hypothesis; the calculated value is higher than the critical value, proving the genes are strictly sex-linked.","Fail to reject the null hypothesis; the sample size must be too small to draw a valid conclusion."],
ans:1,
exp:"The null hypothesis: genes assort independently (9:3:3:1 ratio). Decision rule: if χ² calculated > χ² critical, reject H₀. Here 11.34 > 7.81 → reject H₀. There is a statistically significant deviation from the expected ratio. Note: we 'reject' not 'accept' the alternative (option C uses wrong language). A significant χ² in a dihybrid cross strongly suggests the two genes are physically linked on the same chromosome (violating Mendel's Law of Independent Assortment)."
},
{id:43,topic:"Microbiology & Bacterial Genetics",
q:"In an Hfr conjugation experiment, the time of entry for each wild-type gene is: leu⁺ = 12 min, arg⁺ = 65 min, thr⁺ = 4 min, his⁺ = 44 min, pro⁺ = 26 min. What is the relative gene order from the origin of transfer (oriT)?",
opts:["thr – leu – pro – his – arg","arg – his – pro – leu – thr","thr – pro – leu – his – arg","leu – thr – pro – his – arg"],
ans:0,
exp:"In Hfr conjugation, the integrated F plasmid transfers the bacterial chromosome linearly starting from oriT. Genes closer to oriT enter the recipient cell FIRST. Gene order = sort by time of entry (shortest to longest): thr (4 min) → leu (12 min) → pro (26 min) → his (44 min) → arg (65 min). This is the interrupted mating/Wollman-Jacob technique — essentially a genetic 'clock' that maps relative distances between genes based on transfer timing."
},
{id:44,topic:"Photosynthesis & C4 Pathway",
q:"C4 plants minimize photorespiration in hot climates via spatial separation of enzymes. Which best describes the carbon flow in a C4 leaf?",
opts:["RuBisCO binds CO₂ at night, while PEP Carboxylase operates during the day.","PEP Carboxylase initially fixes CO₂ into a 4-carbon acid in the MESOPHYLL cells; this acid is transported to the BUNDLE-SHEATH cells where it releases CO₂ directly to RuBisCO.","Both enzymes operate in the mesophyll cells, separated within the chloroplast stroma and thylakoid lumen.","RuBisCO initially fixes CO₂ in mesophyll cells; the resulting 3-PGA is converted to malate and shuttled to bypass oxygen."],
ans:1,
exp:"C4 plants use Kranz anatomy for spatial CO₂ concentration. In MESOPHYLL cells: PEP Carboxylase (no affinity for O₂) fixes CO₂ into oxaloacetate (4C), then malate or aspartate. This 4C molecule is transported to BUNDLE-SHEATH cells (deep, O₂-poor). There, it's decarboxylated, releasing CO₂ in high concentration directly to RuBisCO — suppressing photorespiration. The 3C pyruvate returns to mesophyll to regenerate PEP. Option A describes CAM plants (temporal separation, not spatial)."
},
{id:45,topic:"Ecology & Global Change",
q:"Anthropogenic CO₂ increases drive ocean acidification. At a molecular and ecological level, what is the most significant consequence of dropping ocean pH on marine ecosystems?",
opts:["Increased dissolved CO₂ directly poisons mitochondria of marine algae, halting primary productivity.","Excess CO₂ reacts with water to form carbonic acid, which dissociates and increases H⁺; these free protons bind carbonate ions, reducing carbonate availability needed by corals and mollusks to build shells.","Acidic water causes spontaneous denaturing of all extracellular enzymes in marine invertebrates, preventing digestion.","Ocean acidification drastically increases O₂ solubility, leading to oxygen toxicity in deep-water fish."],
ans:1,
exp:"CO₂ + H₂O → H₂CO₃ (carbonic acid) → H⁺ + HCO₃⁻ (bicarbonate). Excess H⁺ combines with free carbonate ions (CO₃²⁻): H⁺ + CO₃²⁻ → HCO₃⁻. This 'steals' carbonate from the water. Calcifying organisms (corals, oysters, pteropods, sea urchins) need free carbonate to precipitate CaCO₃ for their shells and skeletons: Ca²⁺ + CO₃²⁻ → CaCO₃. Reduced carbonate availability causes thin, brittle, or dissolving shells — a direct threat to marine food webs and reef ecosystems."
},
{id:46,topic:"Cell Communication & Apoptosis",
q:"When a cell experiences severe, irreparable DNA damage, which sequence correctly describes the COMMITMENT STEP of the intrinsic apoptotic pathway?",
opts:["Activation of Death Receptors (Fas) → Caspase 8 activation → Cleavage of cellular targets.","p53 activation → Bax/Bak oligomerization in the mitochondrial membrane → Release of Cytochrome c into the cytosol → Apoptosome formation.","Release of calcium from the smooth ER → Activation of calpains → Degradation of the nuclear envelope.","Inhibition of Bcl-2 → Swelling of the lysosome → Release of cathepsins → Autophagy."],
ans:1,
exp:"Intrinsic apoptosis is governed by mitochondria. DNA damage stabilizes p53, which transcriptionally upregulates pro-apoptotic proteins Bax and Bak. Bax/Bak form oligomeric pores in the outer mitochondrial membrane (MOMP — mitochondrial outer membrane permeabilization), releasing Cytochrome c into the cytosol. Cytochrome c binds Apaf-1, forming the heptameric apoptosome, which activates initiator Caspase-9, sealing the cell's fate. Bcl-2 family members are the master regulators of MOMP. Option A describes the extrinsic (death receptor) pathway."
},
{id:47,topic:"Enzyme Kinetics & Graphing",
q:"A Lineweaver-Burk (double-reciprocal) plot is generated for an enzyme with and without Inhibitor Z. The two lines intersect PERFECTLY ON THE Y-AXIS. What can be definitively concluded about Inhibitor Z?",
opts:["It binds exclusively to the enzyme-substrate (ES) complex.","It binds to an allosteric site and changes conformation, lowering Vmax.","It binds to the active site, competing directly with the substrate, increasing apparent Km but leaving Vmax unchanged.","It is an irreversible inhibitor that covalently modifies the active site residues."],
ans:2,
exp:"In a Lineweaver-Burk plot: y-intercept = 1/Vmax; x-intercept = −1/Km. If the two lines intersect ON the y-axis, they have the SAME y-intercept → same Vmax. But they have different x-intercepts → different Km. Intersection on y-axis (same Vmax, different Km) is the hallmark of COMPETITIVE inhibition. The inhibitor competes with substrate for the active site; excess substrate overcomes the inhibition, leaving Vmax unchanged but requiring more substrate to reach it (increased apparent Km)."
},
{id:48,topic:"Genetics & Epistasis",
q:"In Labrador retrievers: B locus (B=black, b=brown). E locus (E=allows pigment deposition, e=prevents → yellow coat). Cross BbEe × BbEe. What phenotypic ratio is expected in offspring?",
opts:["9 Black : 3 Brown : 4 Yellow","9 Black : 3 Yellow : 3 Brown : 1 White","12 Black : 3 Brown : 1 Yellow","9 Black : 7 Yellow"],
ans:0,
exp:"Standard dihybrid genotype frequencies: 9 B_E_ : 3 bbE_ : 3 B_ee : 1 bbee. Apply epistasis rules: B_E_ (9) = black (pigment deposited + black pigment). bbE_ (3) = brown (pigment deposited + brown pigment). B_ee (3) = yellow (no deposition, masks B locus). bbee (1) = yellow (no deposition, masks B locus). The ee genotype epistatically MASKS the B locus in all 4 individuals (3 B_ee + 1 bbee = 4 yellow). This is recessive epistasis → 9 Black : 3 Brown : 4 Yellow."
},
{id:49,topic:"Molecular Biology & Translation",
q:"The Wobble Hypothesis explains why fewer than 61 distinct tRNA molecules are needed to read 61 amino-acid-coding codons. Non-standard base pairing can occur at which specific position during translation?",
opts:["Between the 1st base of the mRNA codon (5' end) and the 3rd base of the tRNA anticodon (3' end).","Between the 3rd base of the mRNA codon (3' end) and the 1st base of the tRNA anticodon (5' end).","At the 2nd base of the codon, utilizing an Inosine (I) modified nucleotide.","Between the 3rd base of the mRNA codon (3' end) and the 3rd base of the tRNA anticodon (3' end)."],
ans:1,
exp:"mRNA is read 5'→3'. The tRNA anticodon binds the mRNA codon in antiparallel fashion. The 'wobble' occurs at the third position of the mRNA codon (3' end), which pairs with the first position of the tRNA anticodon (5' end). The physical constraints at this end of the base-pairing interaction are less strict ('wobbly'), allowing non-Watson-Crick pairing (e.g., G can pair with U; Inosine can pair with C, U, or A). This lets one tRNA recognize multiple codons differing only in their third nucleotide (degenerate code)."
},
{id:50,topic:"Population Ecology",
q:"A population of paramecia initially grows exponentially, then levels off and fluctuates around a stable maximum size. Which equation best models the instantaneous rate of growth (dN/dt) during the leveling-off phase? (r = intrinsic growth rate, N = population size, K = carrying capacity)",
opts:["dN/dt = rN","dN/dt = rN [(K − N) / K]","dN/dt = rK [(N − K) / N]","dN/dt = N [(r − K) / r]"],
ans:1,
exp:"This is logistic growth — limited by the carrying capacity K. The logistic growth equation: dN/dt = rN × [(K − N) / K]. The term [(K−N)/K] is the 'braking factor' — the fraction of carrying capacity still available. As N approaches K, (K−N)/K approaches 0, so dN/dt approaches 0, causing the S-curve to level off. When N = K: growth rate = 0 (stable equilibrium). Option A (dN/dt = rN) is exponential (J-curve), assuming unlimited resources."
},
{id:51,topic:"Cellular Transport & Organelles",
q:"Botulinum toxin (Botox) prevents acetylcholine release at the neuromuscular junction by acting as a protease that specifically cleaves SNARE proteins. Why does SNARE cleavage inhibit neurotransmitter release?",
opts:["SNARE proteins are required for active transport of acetylcholine from cytosol into synaptic vesicles.","SNARE proteins form the physical bridge between the synaptic vesicle membrane and the plasma membrane, mediating membrane fusion and exocytosis.","SNARE proteins act as the voltage-gated calcium channels that trigger the initial signal for release.","SNARE proteins are responsible for recycling clathrin coats after vesicle budding from the Golgi."],
ans:1,
exp:"Exocytosis requires the lipid bilayer of the synaptic vesicle to physically merge with the plasma membrane — an energetically unfavorable event. SNARE proteins (v-SNAREs on the vesicle, t-SNAREs on the target membrane) intertwine like a molecular zipper, pulling the two membranes together and catalyzing fusion. By proteolytically destroying SNAREs, botulinum toxin leaves vesicles permanently docked but unable to fuse — acetylcholine remains trapped inside the neuron, causing flaccid (floppy) paralysis."
},
{id:52,topic:"Evolutionary Biology",
q:"Haldane's Rule states that if one sex of hybrid offspring between two diverging species is sterile or inviable, it is almost always the HETEROGAMETIC sex. In a cross between two related bird species, male offspring are fertile, but female offspring die in the egg. Does this support Haldane's Rule?",
opts:["No, because in most animals including birds, the male is the heterogametic sex (XY), so males should have died.","Yes, because in birds, the female is the heterogametic sex (ZW), while the male is homogametic (ZZ).","No, because Haldane's rule applies only to sterility, not inviability.","Yes, because hybrid inviability is strictly a product of mitochondrial incompatibility, which is maternally inherited."],
ans:1,
exp:"Haldane's Rule specifically predicts the HETEROGAMETIC sex suffers most in hybridization. In mammals and Drosophila: males are XY (heterogametic), females are XX (homogametic). In birds (and butterflies, some reptiles): the ZW system — females are ZW (heterogametic), males are ZZ (homogametic). Therefore, bird hybrid FEMALES (ZW) are predicted by Haldane's Rule to be inviable/sterile, while ZZ males remain viable. The data (female bird hybrids die, males are fertile) perfectly supports Haldane's Rule."
},
{id:53,topic:"Molecular Biology & DNA Replication",
q:"Telomerase extends the ends of linear chromosomes, solving the 'end-replication problem.' Which accurately describes the biochemical nature of telomerase?",
opts:["An RNA-dependent RNA polymerase that copies a small RNA primer onto chromosome ends.","A DNA-dependent DNA polymerase that uses the homologous chromosome as a template to repair shortened ends.","An RNA-dependent DNA polymerase (reverse transcriptase) that carries its own internal RNA template.","A specialized DNA ligase that creates hairpin loops at chromosome ends to prevent exonuclease degradation."],
ans:2,
exp:"Telomerase is a ribonucleoprotein complex containing two key components: TERT (Telomerase Reverse Transcriptase — the catalytic protein with reverse transcriptase activity) and TERC (Telomerase RNA Component — the built-in RNA template). It reads its own RNA template to synthesize a repeating DNA sequence (TTAGGG in humans) added to the 3' single-stranded overhang of chromosomes. Since it converts RNA template → DNA product, it is biochemically an RNA-dependent DNA polymerase (reverse transcriptase). Overactive in cancer cells; inactive in most somatic cells."
},
{id:54,topic:"Ecology & Biogeochemical Cycles",
q:"An agricultural field becomes heavily waterlogged and anaerobic. Which bacterial process will dominate, resulting in a DIRECT LOSS of bioavailable nitrogen from the soil ecosystem?",
opts:["Nitrogen fixation (N₂ → NH₃)","Nitrification (NH₄⁺ → NO₃⁻)","Ammonification (Organic N → NH₄⁺)","Denitrification (NO₃⁻ → N₂)"],
ans:3,
exp:"Denitrification is an anaerobic process carried out by bacteria (e.g., Pseudomonas, Paracoccus) that use nitrate (NO₃⁻) as the terminal electron acceptor in anaerobic respiration instead of O₂. This reduces nitrate back to N₂ gas (or N₂O), which escapes to the atmosphere — permanently removing bioavailable nitrogen from the soil. This is detrimental to soil fertility. The other processes: nitrogen fixation adds N; nitrification requires O₂ (aerobic); ammonification converts organic N to NH₄⁺ (still bioavailable)."
},
{id:55,topic:"Cell Signaling & RTKs",
q:"Receptor Tyrosine Kinases (RTKs) are cell surface receptors for growth factors. Upon binding EGF, what is the immediate, direct mechanistic step that initiates intracellular signal transduction?",
opts:["The receptor unbinds from a G-protein, allowing the alpha subunit to exchange GDP for GTP.","Receptor monomers undergo dimerization, followed by cross-phosphorylation (autophosphorylation) of intracellular tyrosine residues.","The receptor opens an intrinsic ion channel, allowing massive Ca²⁺ influx to activate calmodulin.","The receptor is endocytosed and transported to the nucleus, where it acts directly as a transcription factor."],
ans:1,
exp:"RTKs exist as single-pass transmembrane monomers in their resting state. Ligand binding (e.g., EGF dimerizes) brings two RTK monomers together. Physical proximity allows the intracellular kinase domain of each monomer to phosphorylate tyrosine residues on the partner monomer (trans-autophosphorylation). These phospho-tyrosines create docking sites for SH2-domain-containing relay proteins (Grb2, PLCγ, PI3K), initiating downstream signaling cascades (Ras/MAPK, PI3K/Akt). GPCRs use G-proteins (A); ligand-gated channels open immediately (C)."
},
{id:56,topic:"Genetics & Chromosomal Abnormalities",
q:"A phenotypically NORMAL male has a child with Down syndrome. Karyotype of the father reveals he has 45 chromosomes. Which best explains the genetic status of the father?",

const ROOT = () => document.getElementById('root');
const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function fmtTime(s) {
  const m = Math.floor(s / 60), sec = s % 60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function fmtElapsed(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60), sec = s % 60;
  return `${m}m ${sec}s`;
}

function getNavClass(i) {
  let c = 'nq';
  if (i === S.cur) c += ' cur';
  if (S.mode === 'practice') {
    if (S.rev[i]) c += S.sel[i] === QUESTIONS[i].ans ? ' correct' : ' wrong';
    else if (S.sel[i] !== null) c += ' answered';
  } else {
    if (S.sel[i] !== null) c += ' answered';
  }
  if (S.flag[i]) c += ' flagged';
  return c;
}

function getScore() {
  let correct = 0, answered = 0;
  for (let i = 0; i < 60; i++) {
    if (S.sel[i] !== null) {
      answered++;
      if (S.sel[i] === QUESTIONS[i].ans) correct++;
    }
  }
  return { correct, answered, wrong: answered - correct };
}

function topicStats() {
  const map = {};
  QUESTIONS.forEach((q, i) => {
    if (!map[q.topic]) map[q.topic] = { correct: 0, total: 0 };
    map[q.topic].total++;
    if (S.sel[i] === q.ans) map[q.topic].correct++;
  });
  return map;
}

function quizHTML() {

  const struckSet = new Set(S.struck[S.cur]);
  const optionsHTML = q.opts.map((opt, i) => {
    let cls = 'opt';
    let letter = LETTERS[i];
    if (revealed) {
      cls += ' dis';
      if (i === q.ans) { cls += ' ok'; letter = '✓'; }
      else if (i === sel && sel !== q.ans) { cls += ' no'; letter = '✗'; }
    } else {
      if (i === sel) cls += ' sel';
      if (struckSet.has(i)) cls += ' struck';
    }
    const strikeBtn = revealed ? '' : `<button class="opt-sx" onclick="event.stopPropagation();strikeOpt(${i})" title="Strike off">${struckSet.has(i)?'↺':'✗'}</button>`;

function startMode(mode) {
  if (S.timerID) clearInterval(S.timerID);
  const mins = parseInt(document.getElementById('mock-mins')?.value || 90, 10);
  S.mode = mode;
  S.cur = 0;
  S.sel = Array(60).fill(null);
  S.rev = Array(60).fill(false);
  S.flag = Array(60).fill(false);
  S.struck = Array.from({length:60},()=>[]);
  S.mockSecs = (isNaN(mins) ? 90 : Math.max(10, Math.min(180, mins))) * 60;
  S.startTime = Date.now();
  S.endTime = null;
  S.screen = 'quiz';
  if (mode === 'mock') {
    S.timerID = setInterval(() => {
      S.mockSecs--;
      if (S.mockSecs <= 0) { clearInterval(S.timerID); finishExam(); return; }
      const el = $('timer');
      if (el) {
        el.textContent = fmtTime(S.mockSecs);
        if (S.mockSecs < 300) el.classList.add('urgent');
      }
    }, 1000);
  }
  render();
}

function startMockPrompt() {
  const mins = parseInt(document.getElementById('mock-mins')?.value || 90, 10);
  S.mockMins = isNaN(mins) ? 90 : mins;
  startMode('mock');
}

function goTo(i) {
  S.cur = Math.max(0, Math.min(59, i));
  if (window.innerWidth <= 768) S.sbOpen = false;
  render();
}

function toggleSidebar() {
  S.sbOpen = !S.sbOpen;
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sb-ov');
  if (sb) sb.classList.toggle('open', S.sbOpen);
  if (ov) ov.classList.toggle('show', S.sbOpen);
}

function selectAns(i) {
  if (S.mode === 'practice' && S.rev[S.cur]) return;
  S.sel[S.cur] = i;
  render(); autoSave();
}

function revealAns() {
  if (S.sel[S.cur] === null) return;
  S.rev[S.cur] = true;
  render(); autoSave();
}

function toggleFlag() {
  S.flag[S.cur] = !S.flag[S.cur];
  render(); autoSave();
}

function strikeOpt(i) {
  const arr = S.struck[S.cur];
  const idx = arr.indexOf(i);
  if (idx === -1) arr.push(i); else arr.splice(idx, 1);
  render(); autoSave();
}

function confirmFinish() {
  const unanswered = S.sel.filter(x => x === null).length;
  const msg = unanswered > 0
    ? `You have ${unanswered} unanswered question${unanswered>1?'s':''}. Finish anyway?`
    : 'Submit exam and see results?';
  if (confirm(msg)) finishExam();
}

function finishExam() {
  if (S.timerID) clearInterval(S.timerID);
  S.endTime = Date.now();
  localStorage.removeItem(PROG_KEY); // clear progress on completion
  S.screen = 'results';
  render();
}

function backHome() {
  if (S.timerID) clearInterval(S.timerID);
  S.screen = 'home';
  render();
}

// ══ SESSION PERSISTENCE ══════════════════════
const PROG_KEY = 'gide_mcq_session';

function autoSave() {
  if (S.screen !== 'quiz') return;
  const d = {
    mode: S.mode, cur: S.cur,
    sel: [...S.sel], rev: [...S.rev],
    flag: [...S.flag],
    struck: S.struck.map(a => [...a]),
    mockSecs: S.mockSecs,
    startTime: S.startTime,
    ts: Date.now()
  };
  localStorage.setItem(PROG_KEY, JSON.stringify(d));
}

function loadSavedSession() {
  try {
    const d = JSON.parse(localStorage.getItem(PROG_KEY) || 'null');
    if (!d) return null;
    if (Date.now() - d.ts > 48 * 60 * 60 * 1000) { localStorage.removeItem(PROG_KEY); return null; }
    return d;
  } catch(e) { return null; }
}

function continueSession() {
  const d = loadSavedSession();
  if (!d) { render(); return; }
  if (S.timerID) clearInterval(S.timerID);
  S.mode = d.mode; S.cur = d.cur || 0;
  S.sel = d.sel || Array(60).fill(null);
  S.rev = d.rev || Array(60).fill(false);
  S.flag = d.flag || Array(60).fill(false);
  S.struck = (d.struck || []).map(a => [...a]);
  if (S.struck.length < 60) S.struck = Array.from({length:60}, (_,i) => S.struck[i] || []);
  S.mockSecs = d.mockSecs || 90 * 60;
  S.startTime = d.startTime || Date.now();
  S.endTime = null;
  S.screen = 'quiz';
  if (S.mode === 'mock') {
    S.timerID = setInterval(() => {
      S.mockSecs--;
      if (S.mockSecs <= 0) { clearInterval(S.timerID); finishExam(); return; }
      const el = $('timer');
      if (el) { el.textContent = fmtTime(S.mockSecs); if (S.mockSecs < 300) el.classList.add('urgent'); }
    }, 1000);
  }
  render();
}

function discardSession() {
  localStorage.removeItem(PROG_KEY);
  render();
}

function replaySession() {
  if (!confirm('Start a new session? Current progress will be cleared.')) return;
  if (S.timerID) clearInterval(S.timerID);
  localStorage.removeItem(PROG_KEY);
  S.screen = 'home';
  render();
}

function reviewMode() {
  if (S.timerID) clearInterval(S.timerID);
  S.mode = 'practice';
  S.cur = 0;
  S.rev = Array(60).fill(false);
  S.screen = 'quiz';
  render();
}

function exportFlashcardsHTML() {
  const wrong = getWrongQuestions();
  if (!wrong.length) { alert('No wrong answers to export!'); return; }
  const html = buildFlashcardHTML(wrong, false);
  const blob = new Blob([html], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ap_bio_flashcards_${wrong.length}_cards.html`;
  a.click();
}

function printFlashcards() {
  const wrong = getWrongQuestions();
  if (!wrong.length) { alert('No wrong answers to print!'); return; }
  const html = buildFlashcardHTML(wrong, true);
  const w = window.open('', '_blank', 'width=900,height=700');
  w.document.write(html);
  w.document.close();
  w.onload = () => { w.print(); };
}

function exportFlashcardsCSV() {
  const wrong = getWrongQuestions();
  if (!wrong.length) { alert('No wrong answers to export!'); return; }
  const rows = wrong.map(q => {
    const front = `Q${q.id} (${q.topic}): ${q.q}\\n\\n${q.opts.map((o,j) => `${LETTERS[j]}) ${o}`).join('\\n')}`;
    const back = `${LETTERS[q.ans]}) ${q.opts[q.ans]}\\n\\n${q.exp}`;
    return `"${front.replace(/"/g,'""')}"\t"${back.replace(/"/g,'""')}"\tAP-Bio`;
  });
  const csv = 'Front\tBack\tTags\n' + rows.join('\n');
  const blob = new Blob([csv], {type:'text/tab-separated-values'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ap_bio_flashcards_anki.txt';
  a.click();
}

    canvas.addEventListener('mousedown',ds);canvas.addEventListener('mousemove',dm);
    canvas.addEventListener('mouseup',de);canvas.addEventListener('mouseleave',de);
    canvas.addEventListener('touchstart',e=>{e.preventDefault();ds(e.touches[0]);},{passive:false});
    canvas.addEventListener('touchmove',e=>{e.preventDefault();dm(e.touches[0]);},{passive:false});
    canvas.addEventListener('touchend',de);
    document.addEventListener('mouseup',e=>{
      if(e.target.closest('#ann-wrap')||e.target.closest('#hl-menu')||e.target.closest('.stk')||e.target.closest('#hl-np')||mode==='draw'||mode==='erase')return;
      setTimeout(()=>{
        const sel=window.getSelection();
        if(sel&&!sel.isCollapsed&&sel.toString().trim())positionHL(sel);
        else if(hlMenu)hlMenu.style.display='none';
      },30);
    });
    document.addEventListener('click',e=>{
      const mk=e.target.closest('mark.hl');
      if(mk&&!e.target.closest('#hl-np')){e.preventDefault();showHLNote(mk,e.clientX,e.clientY);return;}
      if(!e.target.closest('#hl-np'))closeHLNotePopup();
      noteH(e);
    });
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(hlMenu)hlMenu.style.display='none';closeHLNotePopup();setM(null);}});
  }
  function ds(e){if(mode!=='draw'&&mode!=='erase')return;drawing=true;ctx.beginPath();ctx.moveTo(e.clientX,e.clientY);}
  function dm(e){
    if(!drawing)return;
    if(mode==='erase'){ctx.clearRect(e.clientX-penSz*3,e.clientY-penSz*3,penSz*6,penSz*6);return;}
    ctx.strokeStyle=penC;ctx.lineWidth=penSz;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineTo(e.clientX,e.clientY);ctx.stroke();ctx.beginPath();ctx.moveTo(e.clientX,e.clientY);
  }
  function de(){drawing=false;}
  function noteH(e){
    if(!noteOn)return;
    if(e.target.closest('#ann-wrap')||e.target.closest('.stk')||e.target.closest('#hl-menu'))return;
    mkNote(e.clientX,e.clientY,'');annNT();
  }
  function mkNote(x,y,txt,id){
    const nid=id||('sn'+Date.now());
    const el=document.createElement('div');el.className='stk';el.id=nid;
    el.style.cssText=`left:${x}px;top:${y}px`;
    el.innerHTML=`<div class="stk-hd"><span>Note</span><button class="stk-x" onclick="this.closest('.stk').remove()">✕</button></div><div class="stk-body" contenteditable="true" spellcheck="false">${txt}</div>`;
    document.body.appendChild(el);
    const hd=el.querySelector('.stk-hd');let ox=0,oy=0;
    hd.addEventListener('mousedown',ev=>{
      ev.preventDefault();ox=ev.clientX-el.offsetLeft;oy=ev.clientY-el.offsetTop;
      const mv=ev=>{el.style.left=(ev.clientX-ox)+'px';el.style.top=(ev.clientY-oy)+'px';};
      const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
    });
    el.querySelector('.stk-body').focus();
  }
  function setM(m){
    mode=m;
    document.body.className=document.body.className.replace(/\bann-\S+/g,'').trim();
    if(m==='draw')document.body.classList.add('ann-draw');
    if(m==='erase')document.body.classList.add('ann-erase');
    ['ann-db','ann-deb'].forEach(id=>{const b=document.getElementById(id);if(b)b.classList.remove('on');});
    if(m==='draw'){const b=document.getElementById('ann-db');if(b)b.classList.add('on');}
    if(m==='erase'){const b=document.getElementById('ann-deb');if(b)b.classList.add('on');}
  }
  window.annO=()=>document.getElementById('ann-panel').classList.toggle('open');
  window.annDraw=()=>{setM(mode==='draw'?null:'draw');noteOn=false;};
  window.annDrawE=()=>{setM(mode==='erase'?null:'erase');noteOn=false;};
  window.annCC=()=>{if(ctx)ctx.clearRect(0,0,canvas.width,canvas.height);};
  window.annPC=v=>{penC=v;};
  window.annPS=v=>{penSz=parseInt(v);const e=document.getElementById('ann-psz');if(e)e.textContent=v;};
  window.annNT=()=>{noteOn=!noteOn;const b=document.getElementById('ann-nb');if(b)b.classList.toggle('on',noteOn);const h=document.getElementById('ann-nh');if(h)h.style.display=noteOn?'block':'none';if(noteOn)setM(null);};
  window.annSv=()=>{annAutoSave();alert('Annotations saved.');};
  window.annLd=()=>{
    const nts=JSON.parse(localStorage.getItem(SK+'_n')||'[]');
    nts.forEach(n=>mkNote(n.x,n.y,n.txt,n.id));
    const hn=JSON.parse(localStorage.getItem(SK+'_hn')||'{}');
    Object.assign(hlNotes,hn);
    document.querySelectorAll('mark.hl[data-hid]').forEach(m=>{
      if(hlNotes[m.dataset.hid]){m.classList.add('has-note');m.title=hlNotes[m.dataset.hid];}
    });
    const cd=localStorage.getItem(SK+'_c');
    if(cd&&canvas){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0);img.src=cd;}
    alert(nts.length||cd||Object.keys(hn).length?'Loaded.':'No saved annotations.');
  };
  window.annCA=()=>{
    if(!confirm('Clear ALL annotations?'))return;
    document.querySelectorAll('mark.hl').forEach(m=>{const p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);p.removeChild(m);});
    document.querySelectorAll('.stk').forEach(n=>n.remove());
    if(ctx)ctx.clearRect(0,0,canvas.width,canvas.height);
    hlNotes={};[SK+'_n',SK+'_c',SK+'_hn'].forEach(k=>localStorage.removeItem(k));
  };
  document.readyState==='loading'?document.addEventListener('DOMContentLoaded',init):init();
})();
</script>
</body>
</html>
