<head>

<meta name="application-name" content="gide.ai AP Bio Runner">
<meta property="og:title" content="AP Biology Mock Runner — gide.ai">
<meta property="og:description" content="60-question AP Biology exam simulator with practice mode, timed mock, and flashcard export.">

<meta property="og:url" content="https://web.gide.ai/">
<link rel="canonical" href="https://web.gide.ai/">
<link rel="icon" type="image/jpeg" href="logo.jpeg">
<style>
/* ── RESET & BASE ── */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f2f2f2;color:#111;min-height:100vh;-webkit-font-smoothing:antialiased}
:root{--r:0px;--black:#111;--dk:#333;--md:#666;--lt:#999;--bd:#ccc;--bg:#eee;--pale:#f5f5f5;--white:#fff;--red:#C62828;--red-dk:#8e0000;--red-pale:#fde8e8}

/* ── GIDE.AI BRANDING ── */
.gide-bar{background:var(--red);height:3px;width:100%}
.gide-corner{position:absolute;top:0;right:0;width:80px;height:80px;overflow:hidden;pointer-events:none}
.gide-corner-ribbon{position:absolute;top:18px;right:-22px;width:90px;background:var(--red);color:var(--white);font-size:.52rem;font-weight:900;letter-spacing:.07em;text-transform:uppercase;text-align:center;padding:.22rem 0;transform:rotate(45deg)}
.gide-logo{height:22px;width:auto;display:block;object-fit:contain}
.gide-logo-sm{height:16px;width:auto;vertical-align:middle;margin-right:.35rem}
.gide-wordmark{font-size:.82rem;font-weight:900;letter-spacing:-.01em;color:var(--black)}
.gide-wordmark span{color:var(--red)}
.home-brand{display:flex;align-items:center;gap:.5rem;margin-bottom:1rem;padding-bottom:.875rem;border-bottom:1px solid var(--bd)}
.credit-line{font-size:.65rem;color:var(--md);margin-top:1.25rem;padding-top:.875rem;border-top:1px solid var(--bg);display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;line-height:1.6}
.credit-line a{color:var(--red);text-decoration:none;font-weight:700}
.credit-line a:hover{text-decoration:underline}
.red-accent{color:var(--red)!important}
.tb-logo{height:20px;width:auto;display:block;flex-shrink:0;object-fit:contain}
.foot-email{font-size:.62rem;color:var(--red);text-decoration:none;font-weight:700;letter-spacing:.02em;white-space:nowrap;margin-left:auto}
.foot-email:hover{text-decoration:underline}

/* Override selected/active accent to use gide red */
.nq.cur{background:var(--red);color:var(--white)}
.nq.answered{background:#444;color:#ddd}
.nq.correct{background:var(--white);color:var(--black);font-weight:900;outline:2px solid var(--white);outline-offset:-2px}
.opt.sel:not(.ok):not(.no){border-color:var(--red);background:var(--red);color:var(--white)}
.opt.ok{border:2px solid var(--black);background:var(--white);font-weight:700}
.prog-fill{height:100%;background:var(--red)!important;transition:width .3s}
.qt-qnum{background:var(--red)!important}
.qt-flag.on{background:var(--red)!important;border-color:var(--red)!important;color:var(--white)}
.qt-timer.urgent{background:var(--red);color:var(--white);animation:blink 1s infinite}
.wi-opt.cor{background:var(--red)!important;color:var(--white)!important;font-weight:700}
.btn-fill{background:var(--red);color:var(--white)}
.btn-fill:hover{background:var(--red-dk)}
.btn-fill:disabled{background:var(--lt);cursor:not-allowed}
.btn-out{background:var(--white);color:var(--red);border:1.5px solid var(--red)}
.btn-out:hover{background:var(--red);color:var(--white)}
.expln{border:1px solid var(--bd);border-left:3px solid var(--red);padding:.875rem 1.1rem;margin-top:.875rem;background:var(--pale)}
.wi{border-left:3px solid var(--red)!important}
.wi-exp{border-left:3px solid var(--red)!important}
.tc-fill{background:var(--red)!important}
.res-hdr{border-bottom:2px solid var(--red)!important}
.score-box{border:3px solid var(--red)!important}
.score-box .big{color:var(--red)}
.sec-lbl{border-bottom-color:var(--red)!important}
.nav-foot{border-top:2px solid var(--red)!important}
.quiz-topbar{border-bottom:2px solid var(--red)!important}
#sidebar .sb-head{border-bottom:1px solid #2a2a2a}
.sb-title{color:var(--white)}
#home .home-card{border-top:3px solid var(--red)}
.mode-card:hover,.mode-card:focus{border-color:var(--red)!important;background:var(--red-pale)}

/* ── HOME ── */
#home{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.25rem}
.home-card{background:var(--white);border:2px solid var(--black);padding:2.25rem 2.5rem;max-width:580px;width:100%}
.app-label{display:block;font-size:.65rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--md);border-bottom:1px solid var(--bd);padding-bottom:.6rem;margin-bottom:1.25rem}
.home-card h1{font-size:2.1rem;font-weight:900;line-height:1;letter-spacing:-.03em;margin-bottom:.4rem}
.home-card>p{color:var(--md);margin-bottom:1.75rem;font-size:.875rem;line-height:1.55}
.stats-row{display:flex;border:1px solid var(--bd);margin-bottom:1.75rem}
.stat{flex:1;padding:.75rem 1rem;border-right:1px solid var(--bd);text-align:center}
.stat:last-child{border-right:none}
.stat span{font-size:1.5rem;font-weight:900;display:block;letter-spacing:-.02em}
.stat small{font-size:.65rem;color:var(--md);text-transform:uppercase;letter-spacing:.06em}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1.25rem}
.mode-card{border:1.5px solid var(--bd);padding:1.1rem;cursor:pointer;transition:border-color .1s,background .1s;background:var(--white)}
.mode-card:hover,.mode-card:focus{border-color:var(--black);background:var(--pale);outline:none}
.mode-card h3{font-size:.82rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.3rem}
.mode-card p{font-size:.78rem;color:var(--md);line-height:1.5}
.mc-icon{font-size:1.3rem;margin-bottom:.5rem;display:block}
.timer-row{display:flex;align-items:center;gap:.6rem;font-size:.78rem;color:var(--md);border-top:1px solid var(--bg);padding-top:1rem}
.timer-row input{width:3.5rem;padding:.3rem .5rem;border:1px solid var(--bd);text-align:center;font-size:.82rem;background:var(--white)}

/* ── QUIZ LAYOUT ── */
#quiz{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
#sidebar{width:256px;min-width:256px;background:var(--black);color:#ddd;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;transition:transform .22s ease}
.sb-head{padding:.875rem 1rem .75rem;border-bottom:1px solid #2a2a2a;display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem}
.sb-head-text{}
.sb-title{font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--white)}
.sb-sub{font-size:.62rem;color:var(--lt);letter-spacing:.05em;text-transform:uppercase;margin-top:.2rem}
.sb-close{background:none;border:none;color:var(--lt);cursor:pointer;font-size:1rem;padding:.1rem .3rem;display:none;line-height:1;margin-top:.1rem}
.sb-stats{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #2a2a2a}
.sb-stat{padding:.55rem .875rem;border-right:1px solid #2a2a2a}
.sb-stat:nth-child(even){border-right:none}
.sb-stat:nth-child(n+3){border-top:1px solid #2a2a2a}
.sb-stat .val{font-size:1.05rem;font-weight:900;color:var(--white);font-variant-numeric:tabular-nums}
.sb-stat .lbl{font-size:.58rem;color:var(--lt);text-transform:uppercase;letter-spacing:.06em}
.sb-pal-wrap{flex:1;overflow-y:auto;padding:.625rem .75rem}
.sb-pal-wrap h3{font-size:.58rem;color:var(--lt);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.45rem}
.nav-palette{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.nq{width:100%;aspect-ratio:1;border:none;font-size:.62rem;font-weight:700;cursor:pointer;background:#2a2a2a;color:var(--lt);transition:background .08s}
.nq:hover{background:#444;color:var(--white)}
.nq.cur{background:var(--white);color:var(--black)}
.nq.answered{background:#555;color:#ddd}
.nq.correct{background:var(--white);color:var(--black);font-weight:900}
.nq.wrong{background:#2a2a2a;color:#666;text-decoration:line-through}
.nq.flagged{outline:2px solid var(--white);outline-offset:-2px}
.sb-legend{padding:.55rem .75rem;border-top:1px solid #2a2a2a}
.sb-legend h3{font-size:.58rem;color:var(--lt);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.4rem}
.leg-grid{display:grid;grid-template-columns:1fr 1fr;gap:.2rem .5rem}
.leg{display:flex;align-items:center;gap:.35rem;font-size:.62rem;color:var(--lt)}
.leg-sq{width:9px;height:9px;flex-shrink:0;border:1px solid #444}

/* Main area */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.quiz-topbar{background:var(--white);border-bottom:2px solid var(--black);padding:.5rem .875rem;display:flex;align-items:center;gap:.625rem;flex-shrink:0}
.sb-tog{display:none;background:none;border:1.5px solid var(--bd);padding:.3rem .45rem;cursor:pointer;font-size:.9rem;line-height:1;color:var(--black)}
.qt-qnum{font-size:.68rem;font-weight:900;letter-spacing:.04em;background:var(--black);color:var(--white);padding:.22rem .55rem;white-space:nowrap}
.qt-topic{font-size:.75rem;color:var(--md);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.qt-flag{background:none;border:1.5px solid var(--bd);cursor:pointer;font-size:.8rem;color:var(--md);padding:.22rem .4rem;line-height:1;transition:all .1s;white-space:nowrap}
.qt-flag.on{background:var(--black);color:var(--white);border-color:var(--black)}
.qt-timer{font-size:.875rem;font-weight:900;font-variant-numeric:tabular-nums;border:1.5px solid var(--bd);padding:.22rem .55rem;background:var(--white);white-space:nowrap}
.qt-timer.urgent{background:var(--black);color:var(--white);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.65}}
.prog-bar{height:2px;background:var(--bg);flex-shrink:0}
.prog-fill{height:100%;background:var(--black);transition:width .3s}
.q-area{flex:1;overflow-y:auto;padding:1.25rem}
.qcard{background:var(--white);border:1px solid var(--bd);padding:1.5rem;margin-bottom:.875rem}
.qtext{font-size:.925rem;line-height:1.7;font-weight:500}
.opts{display:flex;flex-direction:column;gap:.45rem;margin-top:1.2rem}
.opt{display:flex;align-items:flex-start;gap:.7rem;border:1.5px solid var(--bd);padding:.75rem .875rem;cursor:pointer;transition:border-color .1s,background .1s;background:var(--white);text-align:left;font-size:.875rem;line-height:1.5;width:100%}
.opt:hover:not(.dis){border-color:var(--black);background:var(--pale)}
.opt.sel:not(.ok):not(.no){border-color:var(--black);background:var(--black);color:var(--white)}
.opt.ok{border:2px solid var(--black);background:var(--white);font-weight:700}
.opt.no{border:1.5px solid var(--bd);background:var(--pale);color:var(--lt)}
.opt.dis{cursor:default}
.ol{width:22px;height:22px;border:1.5px solid currentColor;font-size:.68rem;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.75}
.opt.sel:not(.ok):not(.no) .ol{color:var(--white);opacity:1;border-color:rgba(255,255,255,.5)}
.opt.ok .ol{opacity:1;background:var(--black);color:var(--white);border-color:var(--black)}
.opt.no .ol{opacity:.5;color:var(--lt)}
.act-row{display:flex;align-items:center;gap:.625rem;margin-top:1.2rem;flex-wrap:wrap}
.btn{padding:.55rem 1.1rem;font-size:.78rem;font-weight:900;border:none;cursor:pointer;transition:all .1s;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.btn-fill{background:var(--black);color:var(--white)}
.btn-fill:hover{background:var(--dk)}
.btn-fill:disabled{background:var(--lt);cursor:not-allowed}
.btn-out{background:var(--white);color:var(--black);border:1.5px solid var(--black)}
.btn-out:hover{background:var(--black);color:var(--white)}
.btn-ghost{background:var(--white);color:var(--black);border:1.5px solid var(--bd)}
.btn-ghost:hover{border-color:var(--black)}
.btn-ghost:disabled{opacity:.45;cursor:not-allowed}
.expln{border:1px solid var(--bd);border-left:3px solid var(--black);padding:.875rem 1.1rem;margin-top:.875rem;background:var(--pale)}
.expln h4{font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--md);margin-bottom:.45rem}
.expln p{font-size:.875rem;line-height:1.65;color:var(--black)}
.nav-foot{background:var(--white);border-top:2px solid var(--black);padding:.625rem .875rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:.5rem}
.qpos{font-size:.72rem;color:var(--md);font-weight:700;font-variant-numeric:tabular-nums}

/* ── RESULTS ── */
#results{min-height:100vh;padding:1.5rem;background:#f2f2f2}
.res-wrap{max-width:860px;margin:0 auto}
.res-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:.75rem;border-bottom:2px solid var(--black);padding-bottom:.875rem}
.res-hdr h1{font-size:1.3rem;font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
.score-card{background:var(--white);border:1.5px solid var(--bd);padding:1.75rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:1.75rem;flex-wrap:wrap}
.score-box{width:96px;height:96px;border:3px solid var(--black);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.score-box .big{font-size:1.5rem;line-height:1.1;letter-spacing:-.02em}
.score-box .pct{font-size:.78rem;color:var(--md)}
.score-det h2{font-size:1.2rem;font-weight:900;margin-bottom:.25rem;letter-spacing:-.01em}
.score-det p{font-size:.82rem;color:var(--md)}
.score-meta{display:flex;gap:1.25rem;flex-wrap:wrap;margin-top:.625rem}
.score-meta span{font-size:.78rem;color:var(--md)}
.score-meta strong{color:var(--black)}
.res-acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.5rem;margin-bottom:1.5rem}
.tc{background:var(--white);border:1px solid var(--bd);padding:.7rem .875rem;font-size:.78rem}
.tc-name{font-weight:700;margin-bottom:.3rem}
.tc-bg{height:3px;background:var(--bg);margin-bottom:.2rem}
.tc-fill{height:3px;background:var(--black)}
.tc-score{font-size:.68rem;color:var(--md)}
.sec-lbl{font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;border-bottom:1.5px solid var(--black);padding-bottom:.35rem;margin-bottom:.75rem}
.wi{background:var(--white);border:1px solid var(--bd);border-left:3px solid var(--black);margin-bottom:.625rem}
.wi-hdr{padding:.55rem .875rem;background:var(--pale);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:.75rem}
.wi-num{font-weight:900;font-size:.78rem}
.wi-top{font-size:.7rem;color:var(--md)}
.wi-bod{padding:.875rem}
.wi-q{font-size:.85rem;line-height:1.55;margin-bottom:.65rem}
.wi-opts{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.65rem}
.wi-opt{font-size:.8rem;padding:.3rem .6rem}
.wi-opt.was{background:var(--pale);color:var(--lt);text-decoration:line-through}
.wi-opt.cor{background:var(--black);color:var(--white);font-weight:700}
.wi-exp{font-size:.78rem;background:var(--pale);border-left:3px solid var(--black);padding:.6rem .85rem;line-height:1.6}

/* Sidebar overlay for mobile */
#sb-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
#sb-ov.show{display:block}

/* ── STRIKE-OFF (MCQ eliminate) ── */
.opt.struck>div:not(.ol){text-decoration:line-through;opacity:.38}
.opt.struck .ol{opacity:.38}
.opt-sx{background:none;border:none;cursor:pointer;font-size:.68rem;color:#ccc;padding:0 .1rem;margin-left:auto;flex-shrink:0;font-weight:900;line-height:1;transition:color .1s}
.opt:hover .opt-sx{color:#999}
.opt.struck .opt-sx{color:#C62828;opacity:1}
.opt.dis .opt-sx{display:none}

/* ── HIGHLIGHT POPUP ── */
#hl-menu{display:none;position:fixed;z-index:10000;background:#111;padding:5px 7px;gap:5px;align-items:center;box-shadow:0 3px 16px rgba(0,0,0,.5);pointer-events:all}
#hl-menu::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid #111}
.hlm-sw{width:20px;height:20px;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:transform .08s}
.hlm-sw:hover{border-color:rgba(255,255,255,.7)!important;transform:scale(1.2)}
.hlm-x{display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:900;background:#444!important;color:#ccc;cursor:pointer;width:20px;height:20px;flex-shrink:0}
.hlm-x:hover{background:#666!important;color:#fff}
mark.hl{border-radius:0;padding:0 1px;cursor:pointer}
mark.hl:hover{filter:brightness(.86)}

/* Highlight note popup */
#hl-np{position:fixed;z-index:10001;background:#fff;border:2px solid #111;width:218px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.hnp-hd{background:#111;color:#fff;padding:.3rem .65rem;display:flex;align-items:center;justify-content:space-between}
.hnp-hd b{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em}
.hnp-hd button{background:none;border:none;color:#888;cursor:pointer;font-size:.9rem;line-height:1}
.hnp-ta{width:100%;min-height:72px;resize:vertical;border:none;border-bottom:1px solid #eee;padding:.45rem .6rem;font-size:.78rem;font-family:inherit;outline:none;line-height:1.5;display:block;color:#111}
.hnp-btns{display:flex;gap:.4rem;padding:.4rem .6rem}
.hnp-btn{padding:.25rem .55rem;font-size:.62rem;font-weight:900;border:1.5px solid #333;background:#fff;color:#333;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
.hnp-btn:hover{background:#111;color:#fff}
.hnp-del{border-color:#C62828;color:#C62828}
.hnp-del:hover{background:#C62828;color:#fff}
mark.hl.has-note{border-bottom:2px dotted rgba(198,40,40,.6)}
mark.hl.has-note::after{content:'';display:inline-block;width:5px;height:5px;background:#C62828;border-radius:50%;vertical-align:super;margin-left:1px}
/* ── ANNOTATION TOOLBAR ── */
#ann-wrap{position:fixed;right:14px;bottom:24px;z-index:9000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;user-select:none}
#ann-fab{width:44px;height:44px;background:#111;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#fff;border-top:3px solid #C62828;box-shadow:0 2px 12px rgba(0,0,0,.3)}
#ann-fab:hover{background:#333}
#ann-panel{display:none;position:absolute;bottom:50px;right:0;background:#fff;border:2px solid #111;width:232px;box-shadow:0 6px 24px rgba(0,0,0,.22)}
#ann-panel.open{display:block}
.aph{background:#111;color:#fff;padding:.4rem .75rem;display:flex;align-items:center;justify-content:space-between}
.aph b{font-size:.67rem;text-transform:uppercase;letter-spacing:.1em}
.aph button{background:none;border:none;color:#888;cursor:pointer;font-size:1rem;line-height:1}
.aps{padding:.5rem .75rem;border-bottom:1px solid #eee}
.aps:last-child{border-bottom:none}
.apl{font-size:.58rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#999;display:block;margin-bottom:.35rem}
.apr{display:flex;align-items:center;gap:.35rem;margin-bottom:.3rem;flex-wrap:wrap}
.ap-sw{width:22px;height:22px;border:2px solid transparent;cursor:pointer;flex-shrink:0}
.ap-sw:hover,.ap-sw.on{border:2px solid #111!important;transform:scale(1.15)}
.ap-sw-x{width:22px;height:22px;background:#fff;border:1.5px solid #ccc;display:flex;align-items:center;justify-content:center;font-size:.65rem;color:#888;font-weight:900;cursor:pointer;flex-shrink:0}
.ap-sw-x:hover{border-color:#111;background:#f5f5f5}
.apbtn{padding:.28rem .6rem;font-size:.65rem;font-weight:900;border:1.5px solid #333;background:#fff;color:#333;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.apbtn:hover{background:#111;color:#fff;border-color:#111}
.apbtn.on{background:#C62828!important;color:#fff!important;border-color:#C62828!important}
.apbtn.rd{border-color:#C62828;color:#C62828}
.apbtn.rd:hover{background:#C62828;color:#fff}
.aphint{font-size:.6rem;color:#bbb;font-style:italic;margin-top:.2rem}
mark.hl{border-radius:0;padding:0 1px;cursor:pointer}
mark.hl:hover{filter:brightness(.86)}
